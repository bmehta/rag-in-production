version: "3.8"

services:
  opensearch:
    image: opensearchproject/opensearch:latest
    container_name: rag-opensearch
    environment:
      - cluster.name=rag-cluster
      - node.name=rag-node-1
      - discovery.seed_hosts=opensearch
      - cluster.initial_master_nodes=rag-node-1
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=AdminPassword123!
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9600:9600"
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 5
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:latest
    container_name: rag-opensearch-dashboards
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true  # Full URL, plural key
    ports:
      - "5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy             # Wait until healthcheck passes
    networks:
      - rag-network
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-backend
    environment:
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - rag-network
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - rag-network
    command: npm run dev

volumes:
  opensearch-data:

networks:
  rag-network:
    driver: bridge
